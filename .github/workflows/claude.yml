name: claude
# Claude works on an issue when the `claude` label is added, or when someone with write access writes @claude
# in an issue or pull request comment. It follows CLAUDE.md: bugs and UI get a branch + pull request link,
# UX gets a plan first, features get a short spec and no code. Authenticates with the Claude Max subscription.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          trigger_phrase: "@claude"
          # Prints Claude's full output in the run log, so a failure shows its real message.
          show_full_output: true
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(pnpm install),Bash(pnpm test),Bash(pnpm typecheck),Bash(pnpm build),Bash(pnpm -r test),Bash(pnpm -r typecheck),Bash(pnpm --filter *),Bash(git status),Bash(git diff *),Bash(git log *)"
