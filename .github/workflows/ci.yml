name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/mynameiseeyern/workpapers:latest
            ghcr.io/mynameiseeyern/workpapers:${{ github.sha }}
      - name: Smoke test (migrations apply, health OK)
        run: |
          docker build -f infra/Dockerfile -t wp-smoke .
          docker run -d --name wp -p 8090:8090 wp-smoke
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8090/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8090/api/health
          docker logs wp
