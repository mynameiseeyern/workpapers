  return '<h2>Setup — '+fyLabel()+'</h2><p class="sub">Settings for this year, in one place. Change the year in the sidebar.</p>'
    + schedCard + abn + house + rates + how + PROTO_NOTE;
}

// ---------- shell ----------
function syncNavToggle(){
  var nt = el("navtoggle"); if(!nt) return;
  var sec = secById(state.view); el("navcur").textContent = sec ? sec.name : "Sections";
  nt.setAttribute("aria-expanded", String(document.body.classList.contains("nav-open")));
}
function navVisible(x){
  // a schedule earns a place in the sidebar once it has rows, or you've said it applies this year
  var top = x.parent ? secById(x.parent) : x;
  if(!isDataSec(top)) return true;
  if(!applies(top.id)) return false;
  if(x.parent){ if(x.id==="s07b") return deductionTotals().depr.length>0 || state.view===x.id; return hasRows(x.id) || state.view===x.id || navVisible(top); }
  var kids = SECTIONS.filter(function(k){ return k.parent===x.id; });
  return hasRows(x.id) || kids.some(function(k){ return hasRows(k.id) || state.view===k.id; }) || appliesRec(x.id)===true || state.view===x.id;
}
function renderNav(){
  var html = '', lastGroup = null, more = [];
  function item(x, muted){
    var tot = sectionTotal(x.id);
    return '<button class="navitem'+(x.parent?' sub':'')+'" data-go="'+x.id+'" aria-current="'+(state.view===x.id)+'"'+(muted?' style="opacity:.6"':'')+'>'
      +'<span class="nm">'+esc(x.name)+'</span>'+(tot!=null&&!muted?'<span class="amt num">'+money(tot)+'</span>':'')+'</button>';
  }
  SECTIONS.forEach(function(x){
    if(x.hidden) return;
    if(x.id==="bas" && !basHolders().length && state.view!=="bas") return;
    var top = x.parent ? secById(x.parent) : x;
    if(isDataSec(top) && applies(top.id) && !navVisible(x)){ if(!x.parent) more.push(x); return; }
    if(!navVisible(x)) return;
    if(x.group!==lastGroup){
      if(lastGroup==="Other" || (x.group==="Tools" && lastGroup!=="Other")) html += moreBlock();
      html += x.group ? '<div class="navlabel" style="margin-top:10px">'+esc(x.group)+'</div>' : '';
      lastGroup = x.group;
    }
    html += item(x);
  });
  function moreBlock(){
    if(!more.length) return "";
    var out = '<button class="navitem navmore" data-navmore="1">'+(state.navMore?'− Hide':'+ '+more.length+' more')+' schedule'+(more.length===1?'':'s')+'</button>';
    if(state.navMore) out += more.map(function(x){ return item(x, true); }).join("");
    return out;
  }
  el("nav").innerHTML = html;
}

function renderWho(){
  el("who").innerHTML = [HOUSEHOLD].concat(OWNERS).map(function(o){
    return '<button class="tabs__tab" data-who="'+esc(o)+'" data-selected="'+(state.person===o)+'" aria-pressed="'+(state.person===o)+'">'+esc(o)+'</button>';
  }).join("");
}
function renderFY(){
  var counts={}; state.rows.forEach(function(r){ var f=rowFY(r); counts[f]=(counts[f]||0)+1; });
  el("fy").innerHTML = fyList().map(function(f){
    return '<option value="'+f+'"'+(f===state.fy?' selected':'')+'>'+fyLabel(f)+(f===currentFY()?' · current':(counts[f]?'':' · empty'))+'</option>';
  }).join("");
}
function render(){
  syncNavToggle();
  renderFY();
  renderWho();
  renderNav();
  var v = state.view, html;
  if(v==="summary") html = renderSummary();
  else if(v==="s05") html = renderBusiness();
  else if(v==="s07") html = renderDeductions();
  else if(v==="s07a") html = renderWFH();
  else if(v==="s07b") html = renderDepr();
  else if(v==="bas") html = renderBAS();
  else if(v==="hist") html = renderHistory();
  else if(v==="tests") html = renderTests();
  else if(v==="rates") html = renderRates();
  else if(v==="setup") html = renderSetup();
  else if(GEN[v]) html = renderGeneric(secById(v));
  else html = renderNotes();
  var banner = "";
  if(state.flash){ banner += '<div class="note acc">'+esc(state.flash)+'</div>'; }
  var vsec = secById(v); if(vsec) banner += naBanner(vsec);
  if(v!=="summary") banner += returnNotes();
  if(v!=="summary" && vsec && vsec.kind!=="derived" && vsec.kind!=="note"){
    var lockedP = people().filter(function(o){ return returnLocked(o); });
    if(lockedP.length) banner += '<div class="nextline"><strong>'+esc(lockedP.join(" and "))+'\'s '+fyLabel()+' return'+(lockedP.length>1?'s are':' is')+' lodged and locked</strong> — '+(lockedP.length===people().length?'rows here are read-only':'rows for '+esc(lockedP.join(" and "))+', and shared rows, are read-only')+'. <button class="linkbtn" data-go="summary">Reopen from the Summary</button></div>';
  }
  if(isPastFY() && v!=="hist") banner += '<div class="note acc"><strong>You\'re looking at '+fyLabel()+', a past year.</strong> '+(people().every(function(o){return returnLocked(o);}) ? 'The return'+(people().length>1?'s are':' is')+' lodged, so this year is read-only.' : 'Rows can still be added or corrected here so earlier years can be backfilled.')+' <button class="button button--tertiary button--sm" data-fy="'+currentFY()+'">Back to '+fyLabel(currentFY())+'</button></div>';
  el("main").innerHTML = banner + html;

  var sec = SECTIONS.filter(function(s){return s.id===v;})[0];
  if(sec) wireEntry(sec);
  if(v==="hist") wireHistory();
}

function keepPanel(){
  var keep = {}; ["u-reason","u-type"].forEach(function(id){ var e=el(id); if(e) keep[id]=e.value; });
  var ak = el("u-ack") ? el("u-ack").checked : false;
  render();
  for(var id in keep){ if(el(id)) el(id).value = keep[id]; }
  if(el("u-ack")) el("u-ack").checked = ak;
}
function rowById(id){ return state.rows.filter(function(r){return r.id===id;})[0]; }
document.addEventListener("change", function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute("data-pref")){
    var pk = t.getAttribute("data-pref"), pv = parseFloat(t.value);
    if(pk==="mlsFamily"){ state.prefs.mlsFamilyBy = Object.assign({}, state.prefs.mlsFamilyBy||{}); if(isNaN(pv)) delete state.prefs.mlsFamilyBy[state.fy]; else state.prefs.mlsFamilyBy[state.fy]=pv; }
    else { state.prefs.misc = Object.assign({}, state.prefs.misc||{}); state.prefs.misc[pk] = isNaN(pv)?"":pv; }
    savePrefs(); return;
  }
  if(t.getAttribute && t.getAttribute("data-psi")!=null){
    state.prefs.psi = Object.assign({}, state.prefs.psi||{}); state.prefs.psi[psiKey(t.getAttribute("data-psi"))] = t.value; savePrefs(); render(); return;
  }
  if(t.getAttribute && t.getAttribute("data-rate")!=null){
    var rk = t.getAttribute("data-rate"), rv = parseFloat(t.value), bag = rk==="wfh" ? "wfhRates" : "carRates";
    state.prefs[bag] = Object.assign({}, state.prefs[bag]||{});
    if(isNaN(rv)) delete state.prefs[bag][state.fy]; else state.prefs[bag][state.fy] = rv;
    savePrefs(); render(); return;
  }
  if(t.getAttribute && t.getAttribute("data-gstreg")!=null){
    state.prefs.gstReg = Object.assign({}, state.prefs.gstReg||{}); state.prefs.gstReg[t.getAttribute("data-gstreg")] = t.value==="1"; savePrefs(); render(); return;
  }
  if(t.getAttribute && t.getAttribute("data-incbasis")!=null){
    state.prefs.incomeBy = Object.assign({}, state.prefs.incomeBy||{}); state.prefs.incomeBy[t.getAttribute("data-incbasis")] = t.value; savePrefs(); render(); return;
  }
  if(t.getAttribute && t.getAttribute("data-basis")!=null){
    state.prefs.basisBy = Object.assign({}, state.prefs.basisBy||{}); state.prefs.basisBy[t.getAttribute("data-basis")] = t.value; savePrefs(); render(); return;
  }
  if(t.getAttribute && t.getAttribute("data-payg")){
    var pq = t.getAttribute("data-payg").split("|"), pvv = parseFloat(t.value);
    state.prefs.payg = Object.assign({}, state.prefs.payg||{});
    state.prefs.payg[paygKey(Number(pq[0]), pq[1])] = isNaN(pvv)?0:pvv; savePrefs(); render(); return;
  }
  if(t.getAttribute && t.getAttribute("data-check")){
    state.prefs.checks = Object.assign({}, state.prefs.checks||{});
    state.prefs.checks[t.getAttribute("data-check")] = t.checked; savePrefs(); return;
  }
 if(!t.getAttribute || !t.getAttribute("data-edit")) return;
  var r = rowById(t.getAttribute("data-id")); if(!r) return;
  if(rowLocked(r)){ render(); return; }
  var f = t.getAttribute("data-edit"), v = parseFloat(t.value);
  if(f==="amount"){ if(isNaN(v)) { render(); return; } r.amount = v; }
  else if(f==="gst"){ if(t.value.trim()===""||isNaN(v)){ r.gst=0; r.noGst=true; } else { r.gst=v; r.noGst=false; } }
  else if(f==="apportion"){ r.apportion = isNaN(v) ? 100 : Math.max(0, Math.min(100, v)); }
  else if(f==="paid"){
    var L = lockOfDate(t.value, ownerOf(r));
    if(L){ state.flash = "That payment date falls in "+ownerOf(r)+"'s "+fyLabel(L.fy)+" Q"+(L.i+1)+", which is lodged and locked. Reopen it on the BAS page first."; render(); return; }
    var before = rowFY(r);
    r.paid = t.value || "";
    if(rowFY(r)!==before){ state.flash = r.party+" now counts in "+fyLabel(rowFY(r))+" — income is counted in the year it is received."; }
  }
  persist(r); render();
});
document.addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target.getAttribute && e.target.getAttribute("data-edit")){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener("click", function(e){
  var c = e.target.closest ? e.target : null;
  state.flash = "";
  var ab = c && c.closest("[data-applies]");
  if(ab){ e.preventDefault(); var dc0 = document.querySelector("[data-confirm]"); state.openConfirm = !!(dc0 && dc0.open && ab.getAttribute("data-applies")!=="*");
    var aid = ab.getAttribute("data-applies"), av = ab.getAttribute("data-val");
    if(aid==="*"){ unconfirmed().forEach(function(x){ setApplies(x.id, suggestApplies(x.id)!==false); }); }
    else setApplies(aid, av==="1");
    render(); return;
  }
  var rq = c && c.closest("[data-rui]");
  if(rq){ state.rui = {mode:rq.getAttribute("data-rui"), o:rq.getAttribute("data-o")}; state.rerr=""; render(); var pn=document.querySelector(".panel .panel"); if(pn&&pn.scrollIntoView) pn.scrollIntoView({block:"nearest"}); return; }
  if(c && c.closest("[data-rui-cancel]")){ state.rui=null; state.rerr=""; render(); return; }
  if(c && c.closest("[data-rui-go]") && state.rui){
    var ru = state.rui, rack = el("r-ack"), rwhy = el("r-reason"), rtyp = el("r-type");
    function keepR(msg){ var k={why:rwhy&&rwhy.value, typ:rtyp&&rtyp.value, ack:rack&&rack.checked}; state.rerr=msg; render(); if(el("r-reason")) el("r-reason").value=k.why||""; if(el("r-type")) el("r-type").value=k.typ||""; if(el("r-ack")) el("r-ack").checked=!!k.ack; }
    if(rack && !rack.checked) return keepR("Tick the confirmation to continue.");
    if(ru.mode==="reopen"){
      if(!rwhy.value.trim()) return keepR("Give a reason — it goes in the history.");
      if(rtyp.value.trim().toUpperCase()!=="AMEND") return keepR("Type AMEND to confirm.");
      setReturn(ru.o, "reopened", "Reopened", rwhy.value.trim());
    } else if(ru.mode==="lodge") setReturn(ru.o, "lodged", "Marked lodged and locked", "");
    else { var rv = retVariance(ru.o); if(rv && rv.any) setReturn(ru.o, "lodged", "Re-locked with amended figures", ""); else { var keep = retRec(ru.o); setReturn(ru.o, "lodged", "Re-locked, no change", ""); state.prefs.returns[returnKey(ru.o)].figures = keep.figures; savePrefs(); } }
    state.rui=null; state.rerr=""; render(); return;
  }
  var rb = c && c.closest("[data-return]");
  if(rb){
    state.prefs.returns = Object.assign({}, state.prefs.returns||{});
    var rk = state.fy+":"+rb.getAttribute("data-return");
    if(rb.getAttribute("data-val")==="1") state.prefs.returns[rk] = {day:todayISO()}; else delete state.prefs.returns[rk];
    savePrefs(); render(); return;
  }
  var ebtn = c && c.closest("[data-editrow]");
  if(ebtn){ state.editing = ebtn.getAttribute("data-editrow"); render(); return; }
  if(c && c.closest("[data-cancel-edit]")){ state.editing = null; render(); return; }
  if(c && c.closest("[data-navmore]")){ state.navMore = !state.navMore; renderNav(); return; }
  var nt2 = c && c.closest("#navtoggle");
  if(nt2){ document.body.classList.toggle("nav-open"); syncNavToggle(); return; }
  var fb = c && c.closest("[data-fy]");
  if(fb){ setFY(Number(fb.getAttribute("data-fy"))); state.ui=null; if(fb.getAttribute("data-view")) state.view=fb.getAttribute("data-view"); render(); window.scrollTo(0,0); return; }
  var wb = c && c.closest("[data-who]");
  if(wb){ state.person = wb.getAttribute("data-who"); state.ui=null; state.err="";
    try{ localStorage.setItem("wp-person", state.person); }catch(x){}
    render(); return; }
  var ub = c && c.closest("[data-ui]");
  if(ub){ state.ui = {mode:ub.getAttribute("data-ui"), q:Number(ub.getAttribute("data-q")), o:ub.getAttribute("data-o")}; state.err=""; render();
    var pn=document.querySelector(".panel"); if(pn&&pn.scrollIntoView) pn.scrollIntoView({block:"nearest"}); return; }
  if(c && c.closest("[data-ui-cancel]")){ state.ui=null; state.err=""; render(); return; }
  if(c && c.closest("[data-ui-go]") && state.ui){
    var u = state.ui, ack = el("u-ack"), why = el("u-reason"), typed = el("u-type");
    BO = u.o;
    if(ack && !ack.checked){ state.err="Tick the confirmation to continue."; BO=null; keepPanel(); return; }
    if(u.mode==="reopen"){
      if(!why.value.trim()){ state.err="Give a reason — it goes in the quarter's history."; BO=null; keepPanel(); return; }
      if(typed.value.trim().toUpperCase()!=="Q"+(u.q+1)){ state.err="Type Q"+(u.q+1)+" to confirm."; BO=null; keepPanel(); return; }
      setLodge(u.q,"reopened","Reopened",why.value.trim());
    } else if(u.mode==="lodge"){ setLodge(u.q,"lodged","Lodged and locked","");
    } else { var vv=variance(u.q); setLodge(u.q,"lodged", vv&&vv.any?"Re-locked with revised figures":"Re-locked, no change",""); }
    BO = null; state.ui=null; state.err=""; render(); return;
  }
  var dc = e.target.closest ? e.target.closest("[data-doc]") : null;
  if(dc){ var dr = rowById(dc.getAttribute("data-doc")); if(dr && !rowLocked(dr)){ dr.doc = !dr.doc; persist(dr); render(); } return; }
  var go = e.target.closest ? e.target.closest("[data-go]") : null;
  if(go){ document.body.classList.remove("nav-open"); state.editing=null; state.rui=null; state.ui=null; state.err=""; state.view = go.getAttribute("data-go"); render(); return; }
  var del = e.target.closest ? e.target.closest("[data-del]") : null;
  if(del){ remove(del.getAttribute("data-del")); return; }
});

function paintTheme(){
  var cur = document.documentElement.getAttribute("data-theme") || "auto";
  Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function(b){ var on=b.getAttribute("data-theme-set")===cur; b.setAttribute("aria-pressed", String(on)); b.setAttribute("data-selected", String(on)); });
  var auto = !document.documentElement.getAttribute("data-theme");
  document.documentElement.classList.toggle("dark", auto ? window.matchMedia("(prefers-color-scheme: dark)").matches : cur==="dark");
}
el("theme").addEventListener("click", function(e){
  var b = e.target.closest("[data-theme-set]"); if(!b) return;
  var v = b.getAttribute("data-theme-set");
  if(v==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", v);
  try{ localStorage.setItem("wp-theme", v); }catch(x){}
  paintTheme();
});
try{ var st = localStorage.getItem("wp-theme"); if(st==="light"||st==="dark") document.documentElement.setAttribute("data-theme", st); }catch(x){}
paintTheme();


function setStore(txt, live){
  el("storetxt").textContent = txt;
  el("store").className = "chip chip--sm "+(live?"chip--success":"chip--default");
}

try{ var sp = localStorage.getItem("wp-person"); if(sp && [HOUSEHOLD].concat(OWNERS).indexOf(sp)>-1) state.person = sp; }catch(x){}
el("fy").addEventListener("change", function(){ setFY(Number(this.value)); state.ui=null; state.err=""; render(); });
setFY(currentFY());
// first paint immediately, without waiting on anything
render();
setStore("connecting…", false);

(async function(){
  var db = null;
  try { db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null)); }
  catch(e){ db = null; }

  if(!db){
    setStore("this session only", false);
    return;
  }
  state.db = db;
  state.live = true;
  setStore("saved & shared", true);

  try{
    db.collection("rows").onSnapshot(function(snap){
      var docs = snap && snap.docs ? snap.docs : (Array.isArray(snap) ? snap : []);
      state.rows = docs.map(function(d){
        var data = d.data ? d.data() : d;
        var id = d.id || data.id;
        return Object.assign({}, data, {id:id.indexOf("/")>-1 ? id.split("/").pop() : id});
      });
      render();
    });
  }catch(e){ setStore("read failed", false); }

  try{
    var p = await db.doc("settings/prefs").get();
    var data = p && (p.data ? p.data() : p);
    if(data && data.wfhRate!=null){ state.prefs = Object.assign(state.prefs, data); render(); }
  }catch(e){}
})();

})();
</script>
