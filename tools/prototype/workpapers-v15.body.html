
</head>

<script>
(function(){
"use strict";


var GST_FREE_NOTE = "no GST";

var SECTIONS = [
  {id:"summary", code:"",   name:"Overview",             kind:"derived", group:""},
  {id:"tests",   code:"",   name:"Tax return",           kind:"derived", group:""},
  {id:"bas",     code:"",   name:"BAS",                  kind:"derived", group:""},
  {id:"i01",     code:"1",  name:"Salary & wages",       kind:"gen", group:"Income"},
  {id:"i10",     code:"10", name:"Interest",             kind:"gen", group:"Income"},
  {id:"i11",     code:"11", name:"Dividends",            kind:"gen", group:"Income"},
  {id:"i12",     code:"12", name:"Employee share schemes", kind:"gen", group:"Income"},
  {id:"i18",     code:"18", name:"Capital gains",        kind:"gen", group:"Income"},
  {id:"i20",     code:"20", name:"Foreign income",       kind:"gen", group:"Income"},
  {id:"i21",     code:"21", name:"Rent",                 kind:"gen", group:"Income"},
  {id:"s05",     code:"15", name:"Business income & expenses", kind:"business", group:"Business"},
  {id:"d01",     code:"D1", name:"Car expenses",         kind:"gen", group:"Deductions"},
  {id:"d03",     code:"D3", name:"Clothing & laundry",   kind:"gen", group:"Deductions"},
  {id:"s07",     code:"D4–10", name:"Work-related & other", kind:"deduction", group:"Deductions"},
  {id:"s07a",    code:"",   name:"Working from home",    kind:"wfh",  parent:"s07", group:"Deductions"},
  {id:"s07b",    code:"",   name:"Decline in value",     kind:"depr", parent:"s07", group:"Deductions"},
  {id:"d07",     code:"D7–8", name:"Interest & dividend deductions", kind:"gen", group:"Deductions"},
  {id:"d12",     code:"D12", name:"Personal super contributions", kind:"gen", group:"Deductions"},
  {id:"d15",     code:"D15", name:"Other deductions",    kind:"gen", group:"Deductions"},
  {id:"h01",     code:"",   name:"Private health insurance", kind:"gen", group:"Other"},
  {id:"s08",     code:"",   name:"Notes for the agent",  kind:"note", group:"Other"},
  {id:"hist",    code:"",   name:"Compare & find",       kind:"derived", group:"Tools"},
  {id:"setup",   code:"",   name:"Setup",                kind:"derived", group:"Tools"},
  {id:"rates",   code:"",   name:"Rates & thresholds",   kind:"derived", group:"Tools", hidden:true}
];
// ---------- which schedules apply this year ----------
// prefs.applies["<fy>:<section>"] = true | false. Unset = not yet confirmed; suggested from rows and last year.
function isDataSec(x){ return ["gen","business","deduction"].indexOf(x.kind)>-1; }
function appliesKey(id){ return state.fy+":"+id; }
function appliesRec(id){ var v=(state.prefs.applies||{})[appliesKey(id)]; return v===true||v===false ? v : null; }
function hasRows(id, fy){ return state.rows.some(function(r){ return r.section===id && rowFY(r)===(fy||state.fy); }); }
function suggestApplies(id){
  if(hasRows(id)) return true;
  var prev=(state.prefs.applies||{})[(state.fy-1)+":"+id];
  if(prev===true || hasRows(id, state.fy-1)) return true;
  if(prev===false) return false;
  return null;   // no history either way
}
function applies(id){ var a=appliesRec(id); if(a!==null) return a; if(hasRows(id)) return true; var sg=suggestApplies(id); return sg!==false; }
function setApplies(id, v){ state.prefs.applies=Object.assign({},state.prefs.applies||{}); state.prefs.applies[appliesKey(id)]=v; savePrefs(); }
function unconfirmed(){ return SECTIONS.filter(function(x){ return isDataSec(x) && !x.parent && appliesRec(x.id)===null && !hasRows(x.id); }); }
function confirmCard(){
  if(people().every(function(o){ return returnLocked(o); })) return "";   // a lodged year isn't being set up any more
  var u = unconfirmed(); if(!u.length) return "";
  var yes = u.filter(function(x){return suggestApplies(x.id)===true;}).length, no = u.filter(function(x){return suggestApplies(x.id)===false;}).length;
  return '<details class="card card--default" style="padding:14px 18px"'+(state.openConfirm?' open':'')+' data-confirm><summary style="list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    +'<span style="font-size:15px;font-weight:600">'+plural(u.length,"schedule")+' not confirmed for '+fyLabel()+'</span>'
    +'<span class="sharetag">'+(yes||no ? 'last year: '+yes+' applied, '+no+' didn\'t' : 'no history to suggest from')+'</span>'
    +'<span class="spacer"></span><button class="button button--primary button--sm" data-applies="*" data-val="s">'+(yes||no?'Accept the suggestions':'Mark all as applying')+'</button>'
    +'<span class="button button--tertiary button--sm">Review</span></summary>'
    +'<p style="margin:10px 0;font-size:13px;color:var(--muted)">Nothing has been entered in these yet. "Not this year" moves a schedule out of the way; it can always be brought back.</p>'
    +'<div class="table__scroll-container"><table class="table__content hh" style="min-width:0"><tbody class="table__body">'+u.map(function(x){
      var sg = suggestApplies(x.id);
      return '<tr class="table__row"><td class="table__cell">'+(x.code?'<span class="code" style="color:var(--muted);font-size:12px;margin-right:8px">'+esc(x.code)+'</span>':'')+esc(x.name)
        +(sg===true?' <span class="chip chip--sm chip--accent">applied last year</span>':(sg===false?' <span class="chip chip--sm chip--default">not last year</span>':''))+'</td>'
        +'<td class="table__cell r" style="white-space:nowrap"><button class="button button--tertiary button--sm" data-applies="'+x.id+'" data-val="1">Applies</button> <button class="button button--tertiary button--sm" data-applies="'+x.id+'" data-val="0">Not this year</button></td></tr>';
    }).join("")+'</tbody></table></div>'
    +'</details>';
}
function naBanner(sec){
  var top = sec.parent ? secById(sec.parent) : sec;
  if(!isDataSec(top)) return "";
  if(!applies(top.id)) return '<div class="note"><strong>'+esc(top.name)+' is marked not applicable for '+fyLabel()+'.</strong> It stays out of the summary and the readiness list. <button class="button button--tertiary button--sm" data-applies="'+top.id+'" data-val="1">Applies after all</button></div>';
  if(!hasRows(top.id)) return '<div class="nextline">Applies this year'+(appliesRec(top.id)===null?' (assumed)':'')+' · <button class="linkbtn" data-applies="'+top.id+'" data-val="0">Doesn\'t apply in '+fyLabel()+'</button></div>';
  return "";
}
function secById(id){ return SECTIONS.filter(function(x){return x.id===id;})[0]; }

var ATO_CATS = ["D5 Other work-related — tools & equipment","D5 Other work-related — phone & internet","D5 Other work-related — subscriptions","D5 Other work-related — union & professional fees","D4 Work-related self-education","D2 Work-related travel","D9 Gifts or donations","D10 Cost of managing tax affairs"];
var LEGACY_CATS = {"D5 Tools & equipment":0,"D5 Phone & internet":1,"D5 Subscriptions":2,"D5 Professional memberships":3,"D4 Self-education":4,"D1 Work travel":5,"D9 Gifts & donations":6};
function catLabel(c){ return LEGACY_CATS.hasOwnProperty(c) ? ATO_CATS[LEGACY_CATS[c]] : (c||""); }
var OWNERS = ["Ee","Darrelle"];
var DEPR_THRESHOLD = 300;

var state = { rows:[], prefs:{wfhRate:0.70, basis:"cash"}, view:"summary", person:"Household", db:null, live:false, ui:null, err:"" };

// ---------- helpers ----------
function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){
  var v = Number(n)||0;
  return (v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(s){
  if(!s) return "";
  var p=s.split("-"); if(p.length!==3) return s;
  var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return Number(p[2])+" "+m[Number(p[1])-1]+" "+p[0];
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function el(id){ return document.getElementById(id); }
// ---------- financial years ----------
// A row's year comes from its date. Nothing is archived or copied — every year stays in the same ledger.
function fyOf(date){
  if(!date) return currentFY();
  var y = Number(date.slice(0,4)), m = Number(date.slice(5,7));
  return m>=7 ? y+1 : y;
}
function currentFY(){ return fyOf(todayISO()); }
function fyLabel(fy){ fy = fy||state.fy; return "FY "+(fy-1)+"–"+String(fy).slice(2); }
function fyList(){
  var lo = currentFY()-5;                       // records are kept for five years
  state.rows.forEach(function(r){ if(r.date){ var f=fyOf(r.date); if(f<lo && f>2000) lo=f; } });
  var out=[]; for(var f=currentFY(); f>=lo; f--) out.push(f);
  return out;
}
function fysWithData(){
  var seen={}; state.rows.forEach(function(r){ seen[rowFY(r)]=1; });
  seen[currentFY()]=1;
  return Object.keys(seen).map(Number).sort();
}
function buildQuarters(fy){
  var a=fy-1, b=fy;
  return [[a+"-07-01",a+"-09-30","Jul–Sep "+a,a+"-10-28"],
          [a+"-10-01",a+"-12-31","Oct–Dec "+a,b+"-02-28"],
          [b+"-01-01",b+"-03-31","Jan–Mar "+b,b+"-04-28"],
          [b+"-04-01",b+"-06-30","Apr–Jun "+b,b+"-07-28"]];
}
function setFY(fy){ state.fy = fy; QUARTERS = buildQuarters(fy); }
function asFY(fy, fn){ var prev=state.fy; setFY(fy); try{ return fn(); } finally{ setFY(prev); } }
function isPastFY(){ return state.fy < currentFY(); }
function defaultEntryDate(){ var t=todayISO(); return fyOf(t)===state.fy ? t : QUARTERS[3][1]; }
// ---------- rates & thresholds ----------
// v: value by income year (FY key = year ending 30 June).  ok: years confirmed on ato.gov.au on 23 Sep 2026.
// Anything missing for the viewed year carries forward the latest value and is flagged on the Rates page.
var CHECKED = "23 Sep 2026";
var RATEBOOK = {
  wfh:  {l:"Working from home — fixed rate per hour", fmt:"cents", v:{2021:.52,2022:.52,2023:.67,2024:.67,2025:.70,2026:.70}, ok:[2021,2022,2023,2024,2025,2026],
         src:"https://www.ato.gov.au/individuals-and-families/income-deductions-offsets-and-records/deductions-you-can-claim/work-related-deductions/working-from-home-expenses/fixed-rate-method",
         note:"Covers home and mobile phone, internet and data, electricity and gas, stationery and computer consumables. Actual hours must be recorded for the whole year."},
  car:  {l:"Car expenses — cents per kilometre", fmt:"cents", v:{2023:.78,2024:.85,2025:.88,2026:.88}, ok:[2025,2026],
         src:"https://www.ato.gov.au/forms-and-instructions/individual-tax-return-2026-instructions/deduction-questions-d1-d10-individual-tax-return-2026/d1-work-related-car-expenses-2026",
         note:"Capped at 5,000 work kilometres per car per year."},
  carCap:{l:"Car expenses — kilometre cap", fmt:"km", v:{2020:5000}, ok:["all"], src:"https://www.ato.gov.au/forms-and-instructions/individual-tax-return-2026-instructions/deduction-questions-d1-d10-individual-tax-return-2026/d1-work-related-car-expenses-2026"},
  imm300:{l:"Immediate deduction — employee (non-business) assets", fmt:"money", v:{2020:300}, ok:["all"],
         src:"https://www.ato.gov.au/individuals-and-families/income-deductions-offsets-and-records/deductions-you-can-claim/work-related-deductions/tools-computers-and-items-you-use-for-work/depreciating-assets-you-use-for-work/assets-costing-300-dollars-or-less",
         note:"Tested on your share of the cost for jointly owned assets; sets and identical items bought in the same year are added together. Does not apply to business assets."},
  iawo: {l:"Instant asset write-off — small business, per asset", fmt:"money", v:{2025:20000,2026:20000,2027:20000}, ok:[2027],
         src:"https://www.ato.gov.au/businesses-and-organisations/small-business-newsroom/20000-instant-asset-writeoff-iawo-here-to-stay",
         note:"Assets costing less than this (GST-exclusive if registered) are written off in full. Permanent from 1 July 2026 for aggregated turnover under $10 million."},
  taxInv:{l:"Tax invoice needed to claim a GST credit — above", fmt:"money", v:{2020:82.5}, ok:["all"], src:"https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/claiming-gst-credits/when-you-can-claim-a-gst-credit"},
  gstReg:{l:"GST registration threshold (current or projected GST turnover)", fmt:"money", v:{2020:75000}, ok:["all"], src:"https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/registering-for-gst",
         note:"Current GST turnover = this month plus the previous 11, excluding GST."},
  mls:  {l:"Medicare levy surcharge — family base threshold", fmt:"money", v:{2025:194000,2026:202000,2027:210000}, ok:[2026,2027],
         src:"https://www.ato.gov.au/individuals-and-families/medicare-and-private-health-insurance/medicare-levy-surcharge/medicare-levy-surcharge-income-thresholds-and-rates",
         note:"Plus $1,500 for each MLS dependent child after the first."},
  mlsSingle:{l:"Medicare levy surcharge — single base threshold", fmt:"money", v:{2025:97000,2026:101000,2027:105000}, ok:[2026,2027], src:"https://www.ato.gov.au/individuals-and-families/medicare-and-private-health-insurance/medicare-levy-surcharge/medicare-levy-surcharge-income-thresholds-and-rates"},
  ccCap:{l:"Concessional super contributions cap", fmt:"money", v:{2024:27500,2025:30000,2026:30000,2027:32500}, ok:[2024,2025,2026,2027],
         src:"https://www.ato.gov.au/tax-rates-and-codes/key-superannuation-rates-and-thresholds/contributions-caps",
         note:"Employer super (including salary sacrifice) plus personal contributions you claim a deduction for. Unused cap from the previous five years can be carried forward if your total super balance was under $500,000 on 30 June last year."},
  pu:   {l:"Penalty unit", fmt:"money", v:{2024:313,2025:330,2026:330,2027:364}, ok:[2026,2027],
         src:"https://www.ato.gov.au/individuals-and-families/paying-the-ato/interest-and-penalties/penalties/penalty-units",
         note:"$330 applied from 7 Nov 2024 to 30 Jun 2026; $364 from 1 Jul 2026. Failure to lodge: one unit per 28 days late, up to five for individuals and small businesses."}
};
var FIXED_FACTS = [
  ["Quarterly BAS due dates","28 Oct, 28 Feb, 28 Apr, 28 Jul. Lodging online or through an agent can add two weeks, except for Q2. A due date on a weekend or public holiday moves to the next business day.","https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/business-activity-statements-bas/due-dates-for-lodging-and-paying-your-bas"],
  ["Tax return — lodging yourself","31 October after the year ends. A registered tax agent's lodgment program usually gives longer.","https://www.ato.gov.au/businesses-and-organisations/preparing-lodging-and-paying/reports-and-returns/due-dates-for-lodging-and-paying/due-dates-by-month/october"],
  ["GST credits on a cash basis","Claimed in the period the purchase is paid; GST on sales is reported when payment is received.","https://www.ato.gov.au/businesses-and-organisations/gst-excise-and-indirect-taxes/gst/claiming-gst-credits/when-you-can-claim-a-gst-credit"],
  ["Personal services income — deductions","If the PSI rules apply, a sole trader can't deduct home rent, mortgage interest, rates or land tax, or payments and super to associates for non-principal work. Home running costs, insurance, advertising, depreciation and your own super stay deductible.","https://www.ato.gov.au/businesses-and-organisations/income-deductions-and-concessions/personal-services-income/what-to-do-when-the-psi-rules-apply/claiming-deductions-when-receiving-psi"]
];
function rateYear(key, fy){
  var v = RATEBOOK[key].v; fy = fy||state.fy;
  if(v[fy]!=null) return {val:v[fy], year:fy, carried:false};
  var ys = Object.keys(v).map(Number).sort(function(a,b){return a-b;}), best=null;
  ys.forEach(function(y){ if(y<=fy) best=y; }); if(best==null) best=ys[0];
  return {val:v[best], year:best, carried:true};
}
function rate(key, fy){ return rateYear(key, fy).val; }
function rateStatus(key, fy){
  fy=fy||state.fy; var R=RATEBOOK[key], ry=rateYear(key,fy);
  if(R.ok.indexOf("all")>-1) return "ok";
  if(ry.carried) return "carried";
  return R.ok.indexOf(fy)>-1 ? "ok" : "memory";
}
var WFH_RATES = RATEBOOK.wfh.v;
function wfhRate(){
  var saved = state.prefs.wfhRates && state.prefs.wfhRates[state.fy];
  if(saved!=null) return Number(saved)||0;
  if(state.fy===2027 && state.prefs.wfhRate!=null) return Number(state.prefs.wfhRate)||0;
  return rate("wfh");
}

function allRowsIn(sec){ return state.rows.filter(function(r){return r.section===sec;}); }
// The income year a row belongs to. Business income on a receipts basis counts when it is received;
// unpaid income stays in its invoice year (shown, but not counted) until it is paid.
function incomeBasisOf(o){ return (state.prefs.incomeBy||{})[o] || "receipts"; }
function rowFY(r){
  if(r.section==="s05" && r.direction==="income" && incomeBasisOf(ownerOf(r))==="receipts" && r.paid) return fyOf(r.paid);
  return fyOf(r.date);
}
function notYetDerived(r){ return r.section==="s05" && r.direction==="income" && incomeBasisOf(ownerOf(r))==="receipts" && r.paid===""; }
function rowsIn(sec){ return state.rows.filter(function(r){return r.section===sec && rowFY(r)===state.fy;})
  .sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); }); }

// quarter containing today, bounded to the FY
var QUARTERS = [];
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function currentQuarter(){
  var qs=QUARTERS;
  var t=todayISO();
  for(var i=0;i<qs.length;i++){ if(t>=qs[i][0]&&t<=qs[i][1]) return qs[i]; }
  return null;   // today is outside the year being viewed
}
function daysUntil(d){
  return Math.ceil((new Date(d+"T00:00:00") - new Date())/86400000);
}

// ---------- people ----------
// Every row belongs to one taxpayer, or is "Shared" with a split (share = first owner's %).
// A shared row is entered once; each person's figures are derived from their share.
var HOUSEHOLD = "Household", SHARED = "Shared";
var ASSET_CAT = "Depreciating asset — instant asset write-off";
var PSI_DENIED = ["Home occupancy — rent, mortgage interest, rates, land tax","Payments to associates — non-principal work"];
var BIZ_CATS = ["All other expenses","Cost of sales","Contractors & subcontractors","Superannuation","Motor vehicle","Repairs & maintenance","Rent — business premises",ASSET_CAT,"Depreciation","Interest","Advertising","Insurance","Travel"].concat(PSI_DENIED);
// PSI status per ABN holder per year: "" not assessed | "notpsi" not PSI | "psb" PSI but a personal services business | "applies" PSI rules apply
function gstRegistered(o){ var v=(state.prefs.gstReg||{})[o]; return v!==false; }
function psiKey(o){ return state.fy+":"+o; }
function psiOf(o){ return (state.prefs.psi||{})[psiKey(o)] || ""; }
function assetCost(r){ return (Number(r.amount)||0)-(r.noGst||!gstRegistered(ownerOf(r))?0:(Number(r.gst)||0)); }
var BO = null; // the ABN holder the BAS functions are currently looking at
function people(){ return state.person===HOUSEHOLD ? OWNERS.slice() : [state.person]; }
function ownerOf(r){ return r.owner || OWNERS[0]; }
function shareOf(r,o){
  if(ownerOf(r)===SHARED){
    var pc = r.share==null ? 50 : Number(r.share); if(isNaN(pc)) pc=50;
    pc = Math.max(0, Math.min(100, pc));
    return (o===OWNERS[0] ? pc : 100-pc)/100;
  }
  return ownerOf(r)===o ? 1 : 0;
}
function mine(r){ return people().some(function(o){ return shareOf(r,o)>0; }); }
function basOwner(){ return BO || (state.person===HOUSEHOLD ? OWNERS[0] : state.person); }
function withOwner(o, fn){ var prev=BO; BO=o; try{ return fn(); } finally{ BO=prev; } }
function abnHolders(){
  if(!applies("s05")) return [];
  var seen={}; rowsIn("s05").forEach(function(r){ seen[ownerOf(r)]=1; });
  return people().filter(function(o){ return seen[o]; });
}
function basHolders(){ return abnHolders().filter(gstRegistered); }

// ---------- financial logic ----------
// one entry per (row, taxpayer) — the $300 test is applied to each person's share of the cost
var PHONE_CAT = "D5 Other work-related — phone & internet";
function wfhHoursBy(){ var by={}; OWNERS.forEach(function(o){by[o]=0;}); if(applies("s07")) rowsIn("s07a").forEach(function(r){ by[ownerOf(r)]=(by[ownerOf(r)]||0)+(Number(r.hours)||0); }); return by; }
function isFixedRateCovered(r){ var c = catLabel(r.cat); return c===PHONE_CAT; }
function deductionEntries(){
  var out=[]; if(!applies("s07")) return out;
  var hrs = wfhHoursBy();
  rowsIn("s07").forEach(function(r){
    people().forEach(function(o){
      var sh = shareOf(r,o); if(sh<=0) return;
      var portion = (Number(r.amount)||0)*sh;
      out.push({r:r, o:o, share:sh, portion:portion, gst:(r.noGst?0:(Number(r.gst)||0))*sh, depr:portion>DEPR_THRESHOLD,
                overlap: isFixedRateCovered(r) && hrs[o]>0});
    });
  });
  return out;
}
function deductionTotals(){
  var out = {outright:{}, deprBy:{}, depr:[], entries:[], overlap:[], overlapBy:{}, total:0, deprTotal:0, missing:0};
  OWNERS.forEach(function(o){ out.overlapBy[o]=0; });
  OWNERS.forEach(function(o){ out.outright[o]=0; out.deprBy[o]=0; });
  var seenMissing={};
  deductionEntries().forEach(function(e){
    if(e.depr){ out.depr.push(e); out.deprBy[e.o]+=e.portion; out.deprTotal+=e.portion; return; }
    out.entries.push(e);
    if(e.overlap){ out.overlap.push(e); out.overlapBy[e.o] += e.portion; return; }   // already inside the fixed rate — not claimed twice
    out.outright[e.o] += e.portion; out.total += e.portion;
    if(!e.r.doc && !seenMissing[e.r.id]){ seenMissing[e.r.id]=1; out.missing++; }
  });
  return out;
}
// Hours are logged once, tagged employment (a D5 deduction) or business (an ABN expense).
// claim / hours / by = employment only, since that is what the Deductions schedule claims.
function wfhUse(r){ return r.use==="business" ? "business" : "work"; }
function wfhTotals(){
  var rs = applies("s07") ? rowsIn("s07a").filter(mine) : [], by={}, byBiz={}, hours=0, bizHours=0;
  OWNERS.forEach(function(o){ by[o]=0; byBiz[o]=0; });
  rs.forEach(function(r){
    var h = Number(r.hours)||0;
    if(wfhUse(r)==="business"){ byBiz[ownerOf(r)] += h; bizHours += h; }
    else { by[ownerOf(r)] += h; hours += h; }
  });
  var rate = wfhRate();
  return {hours:hours, by:by, rate:rate, claim:hours*rate, bizHours:bizHours, byBiz:byBiz, bizClaim:bizHours*rate, rows:rs};
}
function businessTotals(owners){
  owners = owners || people();
  var rs = rowsIn("s05").filter(function(r){ return owners.indexOf(ownerOf(r))>-1; });
  var t = {sales:0, gstOnSales:0, gstOnPurchases:0, expenses:0, rows:rs, pool:[], poolTotal:0, psiDenied:[], psiDeniedTotal:0, homeOffice:0, homeHours:0};
  if(applies("s07")) rowsIn("s07a").forEach(function(r){
    if(wfhUse(r)!=="business" || owners.indexOf(ownerOf(r))<0) return;
    var h = Number(r.hours)||0; t.homeHours += h; t.homeOffice += h*wfhRate();
  });
  t.expenses += t.homeOffice;    // fixed rate running costs — no GST credit; still deductible under the PSI rules
  rs.forEach(function(r){
    var amt = Number(r.amount)||0;
    var gst = r.noGst ? 0 : (Number(r.gst)||0);
    if(r.direction==="income"){
      if(notYetDerived(r)){ t.unpaidIncome = (t.unpaidIncome||0) + amt - gst; return; }
      t.sales += amt - gst;                 // income tax figures exclude GST; the BAS picks the GST up
      t.gstOnSales += gst;
    }else{
      var pc = r.apportion==null ? 100 : Number(r.apportion);
      if(isNaN(pc)) pc = 100;
      var reg = gstRegistered(ownerOf(r));
      var exp = (reg ? amt - gst : amt) * (pc/100);          // not registered: no GST credit, so GST is part of the cost
      if(reg) t.gstOnPurchases += gst * (pc/100);   // GST credits are claimed on the BAS regardless of income tax treatment
      if(r.bcat===ASSET_CAT && assetCost(r) >= rate("iawo")){ t.pool.push(r); t.poolTotal += exp; return; }
      if(PSI_DENIED.indexOf(r.bcat)>-1 && psiOf(ownerOf(r))==="applies"){ t.psiDenied.push(r); t.psiDeniedTotal += exp; return; }
      t.expenses += exp;
    }
  });
  return t;
}
// BAS is per ABN, never per household — always computed for one holder
function quarterBAS(q, o){
  q = q || currentQuarter() || QUARTERS[3]; o = o || basOwner();
  var t = {q:q, sales:0, gstOnSales:0, gstOnPurchases:0, count:0, unsubstantiated:0};
  if(!gstRegistered(o)){ t.net = 0; return t; }
  allRowsIn("s05").forEach(function(r){
    if(ownerOf(r)!==o) return;
    var bd = basDate(r);
    if(!bd || bd < q[0] || bd > q[1]) return;
    t.count++;
    var amt = Number(r.amount)||0;
    var gst = r.noGst ? 0 : (Number(r.gst)||0);
    if(r.direction==="income"){ t.sales += amt; t.gstOnSales += gst; }
    else {
      var pc = r.apportion==null ? 100 : Number(r.apportion);
      if(isNaN(pc)) pc=100;
      t.gstOnPurchases += gst*(pc/100);
      if(amt > 82.50 && !r.doc && gst>0) t.unsubstantiated += gst*(pc/100);
    }
  });
  t.net = t.gstOnSales - t.gstOnPurchases;
  return t;
}
function rollingTurnover(o){
  o = o || basOwner();
  var cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear()-1);
  var c = cutoff.toISOString().slice(0,10), sum=0;
  allRowsIn("s05").forEach(function(r){
    if(ownerOf(r)===o && r.direction==="income" && r.date >= c) sum += (Number(r.amount)||0) - (r.noGst?0:(Number(r.gst)||0));   // GST turnover excludes GST
  });
  return sum;
}
function sectionTotal(secId){
  if(secId==="s07"){ var d=deductionTotals(); return d.total + wfhTotals().claim; }
  if(secId==="s07a"){ var w=wfhTotals(); return w.claim + w.bizClaim; }   // everything on that page; the D5 part rolls into Deductions
  if(secId==="s07b") return deductionTotals().deprTotal;
  if(secId==="s05"){ var b=businessTotals(); return b.sales - b.expenses; }
  if(GEN[secId]) return rowsIn(secId).length ? genMain(secId) : null;
  return null;
}

function wireEntry(sec){

}
function renderBusiness(){

  var byCat = {}; if(b.homeOffice) byCat["Home office running costs (fixed rate)"] = b.homeOffice; rs.forEach(function(r){ if(r.direction!=="expense") return; if(b.pool.indexOf(r)>-1 || b.psiDenied.indexOf(r)>-1) return; var pc = r.apportion==null?100:Number(r.apportion); if(isNaN(pc)) pc=100; var k=r.bcat||BIZ_CATS[0]; byCat[k]=(byCat[k]||0)+((Number(r.amount)||0)-(r.noGst?0:(Number(r.gst)||0)))*(pc/100); });

  }
  var body = rs.length ? rs.map(function(r){
    var pc = r.apportion==null?100:r.apportion;

    }

        +'<td class="table__cell"><strong>'+esc(r.party)+'</strong>'+subline(r)+'</td>'
        +'<td class="table__cell r num">'+money(r.amount)+'</td>'
        +'<td class="table__cell r num">'+(r.noGst?'<span class="chip chip--sm chip--default">'+GST_FREE_NOTE+'</span>':money(r.gst))+'</td>'

        +'<td class="table__cell r"><span class="chip chip--sm chip--default" title="Reopen it to change this row.">'+lockLabel(r)+'</span></td>'
        +'</tr>';
    }
    return '<tr class="table__row">'
      +'<td class="table__cell num">'+fmtDate(r.date)+paidLine(true)+'</td>'
      +'<td class="table__cell">'+(r.direction==="income"?'<span class="chip chip--sm chip--accent">in</span>':'<span class="chip chip--sm chip--default">out</span>')+'</td>'

      +'<td class="table__cell r num"><input class="input input--secondary cell num" inputmode="decimal" aria-label="Amount" data-edit="amount" data-id="'+r.id+'" value="'+(Number(r.amount)||0).toFixed(2)+'"></td>'
      +'<td class="table__cell r num"><input class="input input--secondary cell num" inputmode="decimal" aria-label="GST" placeholder="'+GST_FREE_NOTE+'" data-edit="gst" data-id="'+r.id+'" value="'+(r.noGst?"":(Number(r.gst)||0).toFixed(2))+'"></td>'

      +(function(){ var need = r.amount>82.5 && r.direction==="expense" && gstRegistered(ownerOf(r)); return '<td class="table__cell r"><button class="tagbtn chip chip--sm'+(r.doc?' chip--accent':(need?' chip--warning':' chip--default'))+'" data-doc="'+r.id+'" title="'+(gstRegistered(ownerOf(r))?'Click to toggle':'Not registered for GST — a receipt is enough')+'">'+(r.doc?(gstRegistered(ownerOf(r))?'invoice':'receipt'):(need?'needed':'none'))+'</button></td>'; })()

// ---------- BAS lodgment lock ----------
// prefs.lodged.qN = {status:"lodged"|"reopened", figures:{sales,gstOnSales,gstOnPurchases,net}, log:[{at,action,reason}]}
function lodgeKey(i,o){ return state.fy+":"+(o||basOwner())+":q"+(i+1); }
function lodgeRec(i,o){
  o = o || basOwner();
  var L = state.prefs.lodged || {};
  var v = L[lodgeKey(i,o)];
  if(v==null && state.fy===2027) v = L[o+":q"+(i+1)];                    // saved before years were split out
  if(v==null && state.fy===2027 && o===OWNERS[0]) v = L["q"+(i+1)];     // saved before the per-person split
  if(!v) return null;
  if(v===true) return {status:"lodged", figures:null, log:[]};
  return v;
}
function isLodged(i,o){ return !!lodgeRec(i,o); }                       // has been lodged at some point
function isLocked(i,o){ var r=lodgeRec(i,o); return !!r && r.status==="lodged"; }
function isReopened(i,o){ var r=lodgeRec(i,o); return !!r && r.status==="reopened"; }
function quarterIndexOf(date){
  if(fyOf(date)!==state.fy) return -1;
  for(var i=0;i<QUARTERS.length;i++){ if(date>=QUARTERS[i][0] && date<=QUARTERS[i][1]) return i; }
  return -1;
}
// Which date puts a business row on a BAS: date paid on a cash basis, invoice date on accrual.
// r.paid undefined = rows saved before this existed → treat the invoice date as paid.  r.paid "" = not yet paid.
function basisOf(o){ return (state.prefs.basisBy||{})[o] || state.prefs.basis || "cash"; }
function basDate(r){
  if(basisOf(ownerOf(r))!=="cash") return r.date||null;
  if(r.paid===undefined) return r.date||null;
  return r.paid || null;
}
function lockOfDate(d, o){
  if(!d) return null;
  var fy = fyOf(d);
  return asFY(fy, function(){ var i = quarterIndexOf(d); return i>-1 && isLocked(i,o) ? {fy:fy, i:i, q:QUARTERS[i]} : null; });
}
function rowLocked(r){ return !!yearLockOf(r) || (r.section==="s05" && !!lockOfDate(basDate(r), ownerOf(r))); }
function lockLabel(r){
  var Y = yearLockOf(r); if(Y) return esc(Y.o)+"'s "+fyLabel(Y.fy)+" return lodged";
  var L = lockOfDate(basDate(r), ownerOf(r)); return L ? (L.fy!==state.fy?fyLabel(L.fy)+' ':'')+'Q'+(L.i+1)+' BAS locked' : '';
}
function rowActions(r){
  if(rowLocked(r)) return '<span class="chip chip--sm chip--default" title="Reopen it from the Summary (return) or the BAS page (quarter) to change this row.">'+lockLabel(r)+'</span>';
  return '<span style="white-space:nowrap"><button class="button button--tertiary button--sm button--icon-only" data-editrow="'+r.id+'" title="Edit" aria-label="Edit">✎</button>'
    +'<button class="button button--tertiary button--sm button--icon-only del" data-del="'+r.id+'" title="'+(ownerOf(r)===SHARED?'Delete the shared row for both of you':'Delete')+'" aria-label="Delete">&times;</button></span>';
}
function figuresOf(t){ return {sales:t.sales, gstOnSales:t.gstOnSales, gstOnPurchases:t.gstOnPurchases, net:t.net}; }
function variance(i){
  var rec = lodgeRec(i); if(!rec || !rec.figures) return null;
  var t = quarterBAS(QUARTERS[i]), f = rec.figures;
  var v = {sales:t.sales-f.sales, gstOnSales:t.gstOnSales-f.gstOnSales, gstOnPurchases:t.gstOnPurchases-f.gstOnPurchases, net:t.net-f.net};
  v.any = ["sales","gstOnSales","gstOnPurchases","net"].some(function(k){ return Math.abs(v[k])>=0.005; });
  return v;
}
function setLodge(i, status, action, reason){
  var all = Object.assign({}, state.prefs.lodged||{});
  var prev = lodgeRec(i) || {log:[]};
  var rec = {status:status, figures: status==="lodged" ? figuresOf(quarterBAS(QUARTERS[i])) : prev.figures,
             log:(prev.log||[]).concat([{at:new Date().toISOString(), day:todayISO(), action:action, reason:reason||""}])};
  all[lodgeKey(i)] = rec; if(state.fy===2027){ delete all[basOwner()+":q"+(i+1)]; if(basOwner()===OWNERS[0]) delete all["q"+(i+1)]; }
  state.prefs.lodged = all; savePrefs();
}
function reopenNotes(){
  var out="";
  basHolders().forEach(function(o){ withOwner(o,function(){
  QUARTERS.forEach(function(q,i){
    if(!isReopened(i)) return;
    var v = variance(i);
    out += '<div class="note"><strong>'+(people().length>1?esc(o)+' — ':'')+'Q'+(i+1)+' '+esc(q[2])+' is reopened after lodgment.</strong> '
      +(v && v.any ? 'The books now differ from what was lodged — GST position has moved by '+money(v.net)+'. Revise the activity statement with the ATO (or correct it on a later BAS if your agent confirms that is allowed), then re-lock the quarter.'
                   : 'Nothing has changed from the lodged figures yet. Re-lock the quarter on the BAS page when you are done.')
      +'</div>';
  });
  }); });
  return out;
}
function renderBAS(){
  var hs = basHolders();
  var unreg = abnHolders().filter(function(o){ return !gstRegistered(o); });
  if(!hs.length) return '<h2>Activity statements (BAS) — '+fyLabel()+whoSuffix()+'</h2>'
    +(unreg.length ? '<div class="note acc"><strong>'+esc(unreg.join(" and "))+(unreg.length>1?' aren\'t':' isn\'t')+' registered for GST</strong>, so there is no activity statement to prepare. The GST turnover meter on the Business page shows how close the ABN is to the '+money(rate("gstReg"))+' registration threshold.</div>' : '')
    +'<p class="sub">A BAS belongs to one ABN, so it is never combined.</p>'
    +'<div class="card card--default"><div class="empty">No GST-registered ABN with business rows '+(state.person===HOUSEHOLD?'':'for '+esc(state.person)+' ')+'yet.</div></div>';
  if(false) return '<h2>Activity statements (BAS) — '+fyLabel()+whoSuffix()+'</h2><p class="sub">A BAS belongs to one ABN, so it is never combined.</p>'
    +'<div class="card card--default"><div class="empty">No business rows under '+(state.person===HOUSEHOLD?'either ABN':esc(state.person)+'\'s ABN')+' yet. Add them in Business income &amp; expenses and the four quarters appear here.</div></div>';
  return '<h2>Activity statements (BAS) — '+fyLabel()+whoSuffix()+'</h2><p class="sub">All four quarters, derived entirely from the Business section. A BAS belongs to one ABN, so it is never combined — '+(hs.length>1?'each ABN holder has their own grid and their own locks.':'this grid is '+esc(hs[0])+'\'s.')+'</p>'
    + hs.map(function(o){ return withOwner(o, function(){ return renderBASFor(o, hs.length>1); }); }).join("");
}
function renderBASFor(owner, showName){
  var unpaid = basisOf(owner)==="cash" ? allRowsIn("s05").filter(function(r){ return ownerOf(r)===owner && r.paid===""; }).length : 0;
  var cur = currentQuarter(), today = todayISO();
  var qs = QUARTERS.map(function(q,i){
    var t = quarterBAS(q);
    t.i=i; t.days=daysUntil(q[3]); t.lodged=isLodged(i); t.locked=isLocked(i); t.reopened=isReopened(i); t.rec=lodgeRec(i); t.v=variance(i);
    t.isCur = q===cur; t.future = today < q[0]; t.ended = today > q[1];
    return t;
  });
  var fy = {sales:0,gstOnSales:0,gstOnPurchases:0,net:0,count:0,unsubstantiated:0};
  qs.forEach(function(t){ for(var k in fy) fy[k]+=t[k]; });
  var turnover = rollingTurnover(), pct = Math.min(100, turnover/75000*100);

  var notes = "";
  qs.forEach(function(t){
    if(t.lodged || t.future) return;
    if(t.days<-120) return;
    if(t.days<0) notes += '<div class="note"><strong>Q'+(t.i+1)+' '+esc(t.q[2])+' is overdue by '+Math.abs(t.days)+' days.</strong> Failure to lodge on time penalties accrue at one penalty unit ('+money(rate("pu"))+') per 28 days, capped at five units ('+money(rate("pu")*5)+') for a small business. Lodging online or through an agent can add two weeks'+(t.i===1?' — though not for Q2':'')+'. Mark it lodged below if it has gone in.</div>';
    else if(t.ended && t.days<=14) notes += '<div class="note"><strong>Q'+(t.i+1)+' '+esc(t.q[2])+' is due in '+t.days+' days.</strong> A nil activity statement still has to be lodged.</div>';
    else if(t.ended) notes += '<div class="note acc">Q'+(t.i+1)+' '+esc(t.q[2])+' has ended — lodgment due '+fmtDate(t.q[3])+', '+t.days+' days away.</div>';
  });
  if(fy.unsubstantiated>0) notes += '<div class="note"><strong>'+money(fy.unsubstantiated)+' of GST credits at risk across the year.</strong> Expenses over $82.50 need a valid tax invoice.</div>';

  function status(t){
    if(t.reopened) return '<span class="chip chip--sm chip--warning">reopened</span>';
    if(t.lodged) return '<span class="chip chip--sm chip--accent">lodged · locked</span>';
    if(t.future) return '<span class="chip chip--sm chip--default">not started</span>';
    if(!t.ended) return '<span class="chip chip--sm chip--default">in progress</span>';
    if(t.days<0) return '<span class="chip chip--sm chip--warning">overdue</span>';
    return '<span class="chip chip--sm chip--warning">to lodge</span>';
  }
  function line(code,label,fn,cls){
    return '<tr'+(cls?' class="'+cls+'"':'')+'><td class="table__cell code">'+code+'</td><td class="table__cell">'+label+'</td>'
      +qs.map(function(t){ return '<td class="table__cell r num'+(t.isCur?' curq':'')+'">'+fn(t)+'</td>'; }).join("")
      +'<td class="table__cell r num fycol">'+fn(fy)+'</td></tr>';
  }
  function netTxt(t){ return money(Math.abs(t.net))+' <span class="dir">'+(t.net>0?"payable":(t.net<0?"refund":""))+'</span>'; }

  var head = '<thead class="table__header"><tr class="table__row"><th class="table__column"></th><th class="table__column"></th>'+qs.map(function(t){
      return '<th class="table__column r'+(t.isCur?' curq':'')+'">Q'+(t.i+1)+' · '+esc(t.q[2].replace(/ \d{4}$/,""))+'</th>';
    }).join("")+'<th class="table__column r">FY total</th></tr></thead>';

  var body = line("G1","Total sales",function(t){return money(t.sales);})
    + line("1A","GST on sales",function(t){return money(t.gstOnSales);})
    + line("1B","GST on purchases",function(t){return money(t.gstOnPurchases);})
    + line("","<strong>GST payable or refund</strong>",netTxt,"total")
    + line("","GST credits at risk",function(t){return t.unsubstantiated>0?money(t.unsubstantiated):"—";})
    + line("","Business rows",function(t){return String(t.count);})
    + '<tr class="table__row"><td class="table__cell code">T7</td><td class="table__cell">PAYG instalment paid <span class="sharetag">typed — from the BAS</span></td>'+qs.map(function(t){
        var v = paygFor(t.i, owner);
        return '<td class="table__cell r num'+(t.isCur?' curq':'')+'">'+(t.locked?money(v||0):'<input class="input input--secondary cell num" inputmode="decimal" data-payg="'+t.i+'|'+esc(owner)+'" value="'+(v!=null&&v!==0?Number(v).toFixed(2):'')+'" placeholder="0.00">')+'</td>';
      }).join("")+'<td class="table__cell r num fycol">'+money(qs.reduce(function(a,t){return a+(Number(paygFor(t.i,owner))||0);},0))+'</td></tr>'
    + '<tr class="table__row"><td class="table__cell code"></td><td class="table__cell">Lodgment due</td>'+qs.map(function(t){return '<td class="table__cell r num'+(t.isCur?' curq':'')+'">'+fmtDate(t.q[3])+'</td>';}).join("")+'<td class="table__cell"></td></tr>'
    + '<tr class="table__row"><td class="table__cell code"></td><td class="table__cell">Status</td>'+qs.map(function(t){return '<td class="table__cell r'+(t.isCur?' curq':'')+'">'+status(t)+'</td>';}).join("")+'<td class="table__cell"></td></tr>'
    + (qs.some(function(t){return t.rec && t.rec.figures;}) ?
        '<tr class="table__row"><td class="table__cell code"></td><td class="table__cell">GST as lodged</td>'+qs.map(function(t){
          return '<td class="table__cell r num'+(t.isCur?' curq':'')+'">'+(t.rec&&t.rec.figures?netTxt(t.rec.figures):"—")+'</td>';}).join("")+'<td class="table__cell"></td></tr>'
       +'<tr class="table__row"><td class="table__cell code"></td><td class="table__cell">Change since lodged</td>'+qs.map(function(t){
          return '<td class="table__cell r num'+(t.isCur?' curq':'')+'">'+(t.v?(t.v.any?'<span class="chip chip--sm chip--warning">'+money(t.v.net)+'</span>':'none'):"—")+'</td>';}).join("")+'<td class="table__cell"></td></tr>' : '')
    + '<tr class="table__row"><td class="table__cell code"></td><td class="table__cell">Lodgment</td>'+qs.map(function(t){
        var btn;
        if(t.reopened) btn='<button class="button button--primary button--sm" data-ui="relock" data-o="'+esc(owner)+'" data-q="'+t.i+'">Re-lock</button>';
        else if(t.locked) btn='<button class="button button--tertiary button--sm" data-ui="reopen" data-o="'+esc(owner)+'" data-q="'+t.i+'">Reopen…</button>';
        else if(t.ended) btn='<button class="button button--primary button--sm" data-ui="lodge" data-o="'+esc(owner)+'" data-q="'+t.i+'">Mark lodged…</button>';
        else btn='<span style="font-size:12px;color:var(--muted)">after quarter ends</span>';
        return '<td class="table__cell r'+(t.isCur?' curq':'')+'">'+btn+'</td>';
      }).join("")+'<td class="table__cell"></td></tr>';

  // confirmation panel — deliberate friction, never a one-click change
  var panel = "";
  if(state.ui && state.ui.o===owner){
    var u = state.ui, t = qs[u.q], nm = esc(owner)+'\'s Q'+(u.q+1)+' '+esc(t.q[2]);
    var figs = '<table class="table__content baslines" style="min-width:0;margin:8px 0"><tr class="table__row"><td class="table__cell code">G1</td><td class="table__cell">Total sales</td><td class="table__cell r num">'+money(t.sales)+'</td></tr>'
      +'<tr class="table__row"><td class="table__cell code">1A</td><td class="table__cell">GST on sales</td><td class="table__cell r num">'+money(t.gstOnSales)+'</td></tr>'
      +'<tr class="table__row"><td class="table__cell code">1B</td><td class="table__cell">GST on purchases</td><td class="table__cell r num">'+money(t.gstOnPurchases)+'</td></tr></table>';
    var err = state.err ? '<div class="note" style="margin:10px 0 0">'+esc(state.err)+'</div>' : '';
    if(u.mode==="lodge"){
      panel = '<div class="card card--default panel"><h3>Mark '+nm+' as lodged and lock it</h3>'
        +'<p>These are the figures the workpapers hold now. Check they match what was lodged with the ATO — they are saved as the lodged record, and every Business row dated in this quarter becomes read-only.</p>'+figs
        +'<label class="ck"><input type="checkbox" id="u-ack"> These figures match the activity statement I lodged</label>'+err
        +'<div class="row"><button class="button button--primary" data-ui-go="1">Lock quarter</button><button class="button button--secondary" data-ui-cancel="1">Cancel</button></div></div>';
    } else if(u.mode==="reopen"){
      panel = '<div class="card card--default panel danger"><h3>Reopen '+nm+'</h3>'
        +'<p><strong>This quarter has been lodged.</strong> Any change to its rows means the books no longer match the ATO\'s record. You will need to revise the activity statement (or correct the error on a later BAS if your agent confirms that is allowed) and then re-lock the quarter. The reason is kept in the quarter\'s history.</p>'
        +'<div class="f" style="margin:10px 0"><label>Why are you reopening it?</label><input class="input input--secondary" id="u-reason" style="width:100%;max-width:520px" placeholder="e.g. missed Adobe invoice from August"></div>'
        +'<label class="ck"><input type="checkbox" id="u-ack"> I understand I\'m changing lodged books and will need to reconcile with the ATO</label>'
        +'<div class="f" style="margin:10px 0"><label>Type Q'+(u.q+1)+' to confirm</label><input class="input input--secondary" id="u-type" style="width:120px" autocomplete="off"></div>'+err
        +'<div class="row"><button class="button button--danger" data-ui-go="1">Reopen quarter</button><button class="button button--secondary" data-ui-cancel="1">Cancel</button></div></div>';
    } else {
      panel = '<div class="card card--default panel"><h3>Re-lock '+nm+'</h3>'
        +(t.v && t.v.any
          ? '<p><strong>The figures have changed since lodgment</strong> — GST position moved by '+money(t.v.net)+'. Only re-lock once the revised figures below have gone to the ATO; they replace the lodged record.</p>'
          : '<p>Nothing changed while the quarter was open. Re-locking keeps the original lodged record.</p>')+figs
        +(t.v && t.v.any ? '<label class="ck"><input type="checkbox" id="u-ack"> The ATO now holds these revised figures</label>' : '')+err
        +'<div class="row"><button class="button button--primary" data-ui-go="1">Re-lock quarter</button><button class="button button--secondary" data-ui-cancel="1">Cancel</button></div></div>';
    }
  }

  var hist = [];
  qs.forEach(function(t){ (t.rec&&t.rec.log||[]).forEach(function(l){ hist.push({q:t.i,l:l}); }); });
  hist.sort(function(a,b){ return (b.l.at||"").localeCompare(a.l.at||""); });
  var histHTML = hist.length ? '<div class="table-root table-root--primary"><div class="table__scroll-container"><table class="table__content"><thead class="table__header"><tr class="table__row"><th class="table__column">When</th><th class="table__column">Quarter</th><th class="table__column">Action</th><th class="table__column">Reason</th></tr></thead><tbody class="table__body">'
    +hist.map(function(h){ return '<tr class="table__row"><td class="table__cell num">'+fmtDate(h.l.day||(h.l.at||"").slice(0,10))+'</td><td class="table__cell">Q'+(h.q+1)+'</td><td class="table__cell">'+esc(h.l.action)+'</td><td class="table__cell">'+esc(h.l.reason||"—")+'</td></tr>'; }).join("")
    +'</tbody></table></div></div>' : '';


  return (showName?'<h3 style="margin:22px 0 10px;font-size:15px">'+esc(owner)+'\'s ABN</h3>':'')
    +'<div class="nextline">Accounting for GST on '+(basisOf(owner)==="cash"?'a cash':'an accrual')+' basis <button class="linkbtn" data-go="setup">Change in Setup</button></div>'
    +(showName?'':reopenNotes())+notes
    +'<div class="table-root table-root--primary bas4wrap"><div class="table__scroll-container"><table class="table__content baslines bas4">'+head+'<tbody class="table__body">'+body+'</tbody></table></div></div>'
    +panel+histHTML
    +(isPastFY()?'':'<div class="card card--default" style="padding:15px">'
    +'<div class="stat" style="border:0;padding:0">'
    +'<div class="k">Current GST turnover</div>'
    +'<div class="v num">'+money(turnover)+'</div>'
    +'<div class="n">this month and the previous 11, excluding GST, against the '+money(rate("gstReg"))+' GST registration threshold</div>'
    +'<div class="meter meter--sm meter--accent"><div class="meter__track"><div class="meter__fill" style="width:'+pct.toFixed(1)+'%"></div></div></div>'
    +'</div></div>')
    +'<p class="hint">'+(basisOf(owner)==="cash"?'Cash basis: rows fall into a quarter by the date paid, so an invoice from one quarter paid in the next is reported in the next. Unpaid rows stay off every BAS until paid.':'Accrual basis: rows fall into a quarter by the invoice date.')+' '+fy.count+' business row'+(fy.count===1?'':'s')+' this financial year.'
    +(unpaid?' <strong>'+plural(unpaid,"unpaid row")+'.</strong>':'')+'</p>';
}

function asPerson(o, fn){ var prev=state.person; state.person=o; try{ return fn(); } finally{ state.person=prev; } }
function personFigures(o){
  return asPerson(o, function(){
    var d = deductionTotals(), w = wfhTotals(), b = businessTotals();
    var hasAbn = abnHolders().length>0, today = todayISO();
    var tx0 = taxFigures(o);
    var bAll = businessTotals();
    var f = {ccOver: tx0.ccRoom<0 ? 1 : 0, overlap:d.overlap.length, psiUnset: hasAbn && isAbnHolder(o) && !psiOf(o) ? 1 : 0, pool:bAll.pool.length,
            unpaid: allRowsIn("s05").filter(function(r){ return ownerOf(r)===o && r.paid==="" && rowFY(r)===state.fy; }).length,
            superPending:tx0.superPending, imm:d.total, wfh:w.claim, hours:w.hours, weeks:w.rows.length, ded:d.total+w.claim, depr:d.deprTotal, deprN:d.depr.length,
            sales:b.sales, exp:b.expenses, net:b.sales-b.expenses, hasAbn:hasAbn, missing:d.missing,
            needInv:b.rows.filter(function(r){ return r.direction==="expense" && gstRegistered(ownerOf(r)) && (Number(r.amount)||0)>82.5 && !r.doc; }).length,
            basOpen:0, basReopened:0, next:null, gstYear:null};
    f.hasBas = hasAbn && gstRegistered(o) && isAbnHolder(o);
    if(!f.hasBas){ f.needInv = 0; }
    if(f.hasBas){
      f.gstYear = 0;
      QUARTERS.forEach(function(q,i){
        var t = quarterBAS(q,o); f.gstYear += t.net;
        if(isReopened(i,o)) f.basReopened++;
        if(!isLodged(i,o)){
          if(today > q[1]) f.basOpen++;
          if(!f.next && today >= q[0]) f.next = {i:i, q:q, t:t, days:daysUntil(q[3]), ended: today>q[1]};
        }
      });
    }
    return f;
  });
}
// where we are in the year being viewed — decides what the Summary leads with
function phase(){
  var cur = currentFY(), m = Number(todayISO().slice(5,7));
  if(state.fy===cur) return (m===5||m===6) ? "yearend" : "during";
  if(state.fy===cur-1) return "prep";
  return "past";
}
function returnKey(o, fy){ return (fy||state.fy)+":"+o; }
// prefs.returns["fy:o"] = {status:"lodged"|"reopened", day, figures:{taxable,assessable,deductions,paid}, log:[{day,action,reason}]}
function retRec(o, fy){
  var v = (state.prefs.returns||{})[returnKey(o,fy)]; if(!v) return null;
  if(!v.status) return {status:"lodged", day:v.day, figures:null, log:[{day:v.day, action:"Marked lodged", reason:""}]};   // saved before locking existed
  return v;
}
function returnLodged(o, fy){ return !!retRec(o, fy); }
function returnLocked(o, fy){ var r=retRec(o, fy); return !!r && r.status==="lodged"; }
function returnReopened(o, fy){ var r=retRec(o, fy); return !!r && r.status==="reopened"; }
function retFigures(o){ var f = taxFigures(o); return {taxable:f.taxable, assessable:f.assessable, deductions:f.deductions, paid:f.withheld+f.payg}; }
function setReturn(o, status, action, reason){
  var all = Object.assign({}, state.prefs.returns||{}), prev = retRec(o) || {log:[]};
  all[returnKey(o)] = {status:status, day: status==="lodged" && action!=="Re-locked, no change" ? todayISO() : prev.day || todayISO(),
    figures: status==="lodged" ? retFigures(o) : prev.figures,
    log:(prev.log||[]).concat([{day:todayISO(), action:action, reason:reason||""}])};
  state.prefs.returns = all; savePrefs();
}
function retVariance(o){
  var r = retRec(o); if(!r || !r.figures) return null;
  var now = retFigures(o), d = now.taxable - r.figures.taxable;
  return {now:now, then:r.figures, taxable:d, any: Math.abs(d)>=0.005 || Math.abs(now.deductions-r.figures.deductions)>=0.005};
}
// A lodged return locks every row that feeds it — shared rows feed both returns, so either lock holds them.
function yearLockOf(r){
  if(r.section==="s08") return null;
  var fy = rowFY(r), os = ownerOf(r)===SHARED ? OWNERS : [ownerOf(r)];
  for(var i=0;i<os.length;i++){ if(returnLocked(os[i], fy)) return {fy:fy, o:os[i]}; }
  return null;
}
function nextLine(o, f, showName){
  if(!f.hasBas || !f.next) return "";
  var n = f.next, g = n.t.net;
  return '<div class="nextline">'+(showName?'<strong>'+esc(o)+'</strong> · ':'')+'Next BAS: <strong>Q'+(n.i+1)+' '+esc(n.q[2])+'</strong> · due '+fmtDate(n.q[3])
    +' · '+(n.days<0?Math.abs(n.days)+' days overdue':n.days+' days')+(n.ended?'':' · quarter still running')
    +' · GST so far '+money(Math.abs(g))+' '+(g>=0?'payable':'refund')
    +' <button class="linkbtn" data-go="bas">Open</button></div>';
}
function readinessRows(F){
  // F: [{o, f}] — one column per person
  function line(label, key, go, okText){
    return '<tr class="table__row"><td class="table__cell">'+label+'</td>'+F.map(function(x){
      var v = x.f[key];
      if(v==null) return '<td class="table__cell r"><span style="color:var(--muted)">—</span></td>';
      return '<td class="table__cell r">'+(v>0?'<span class="chip chip--sm chip--warning">'+v+' to fix</span>':'<span class="chip chip--sm chip--accent">'+okText+'</span>')+'</td>';
    }).join("")+'<td class="table__cell r"><button class="linkbtn" data-go="'+go+'">Open</button></td></tr>';
  }
  F.forEach(function(x){
    if(!x.f.hasAbn){ x.f = Object.assign({}, x.f, {needInv:null, basOpen:null, basReopened:null, psiUnset:null, pool:null, unpaid:null}); }
    else if(!x.f.hasBas){ x.f = Object.assign({}, x.f, {needInv:null, basOpen:null, basReopened:null}); }
  });
  return line("Deduction rows without written evidence","missing","s07","all evidenced")
    + line("Business expenses over $82.50 without a tax invoice","needInv","s05","all invoiced")
    + line("BAS quarters ended but not marked lodged","basOpen","bas","up to date")
    + line("BAS quarters reopened and not re-locked","basReopened","bas","none")
    + line("Super contributions without notice of intent + acknowledgement","superPending","d12","all claimable")
    + line("Concessional super over the cap","ccOver","tests","within cap")
    + line("Phone &amp; internet rows overlapping the WFH fixed rate","overlap","s07","none")
    + line("Personal services income status not assessed","psiUnset","s05","assessed")
    + line("Business assets over the instant asset write-off threshold","pool","s05","none")
    + line("Invoices not yet paid or received","unpaid","s05","none")
    + '<tr class="table__row"><td class="table__cell">Depreciating assets for the agent to assess</td>'+F.map(function(x){ return '<td class="table__cell r num">'+x.f.deprN+'</td>'; }).join("")+'<td class="table__cell r"><button class="linkbtn" data-go="s07b">Open</button></td></tr>'
    + '<tr class="table__row"><td class="table__cell">Working from home — weeks logged</td>'+F.map(function(x){ return '<td class="table__cell r num">'+x.f.weeks+'</td>'; }).join("")+'<td class="table__cell r"><button class="linkbtn" data-go="s07a">Open</button></td></tr>';
}

    +F.map(function(x){ return '<th class="table__column r">'+esc(x.o)+'</th>'; }).join("")+'<th class="table__column"></th></tr></thead><tbody class="table__body">'+readinessRows(F)+'</tbody></table></div></div>';

function prepCard(F){

    +'</div>';
}
function returnPanel(){

    +'<div class="row"><button class="button button--primary" data-rui-go="1">Lock '+fyLabel()+'</button><button class="button button--secondary" data-rui-cancel="1">Cancel</button></div></div>';
  if(u.mode==="reopen") return '<div class="card card--default panel danger" style="margin-top:12px"><h3>Reopen '+esc(o)+'\'s '+fyLabel()+' return</h3><p><strong>This return has been lodged.</strong> Any change from here means the workpapers no longer match the ATO\'s assessment, and you will need to lodge an amendment. The reason is kept in the history.</p>'
    +'<div class="f" style="margin:10px 0"><label>Why are you reopening it?</label><input class="input input--secondary" id="r-reason" style="width:100%;max-width:520px" placeholder="e.g. missed a dividend statement"></div>'

  return '<div class="card card--default panel" style="margin-top:12px"><h3>Re-lock '+esc(o)+'\'s '+fyLabel()+' return</h3>'
    +(v && v.any ? '<p><strong>Taxable income has moved by '+money(v.taxable)+' since lodgment.</strong> Re-lock once the amendment has gone to the ATO; these figures replace the lodged record.</p>'+figs+'<label class="ck"><input type="checkbox" id="r-ack"> The amendment has been lodged</label>' : '<p>Nothing changed while the return was open. Re-locking keeps the original lodged record.</p>')+err

function returnNotes(){
  var out = "";
  people().forEach(function(o){
    if(!returnReopened(o)) return; var v = retVariance(o);
    out += '<div class="note"><strong>'+esc(o)+'\'s '+fyLabel()+' return is reopened after lodgment.</strong> '+(v&&v.any?'Taxable income has moved by '+money(v.taxable)+' — an amendment is needed.':'Nothing has changed yet.')+' Re-lock it from the Summary when done.</div>';
  });
  return out;
}
function basReminders(){
  var out="", today = todayISO(), multi = people().length>1;
  basHolders().forEach(function(o){
    QUARTERS.forEach(function(q,i){
      if(isLodged(i,o) || today <= q[1]) return;
      var dd = daysUntil(q[3]); if(dd < -120) return;
      var nm = (multi?esc(o)+' — ':'')+'Q'+(i+1);
      out += dd<0
        ? '<div class="note"><strong>'+nm+' BAS overdue by '+Math.abs(dd)+' days</strong> — '+esc(q[2])+'.</div>'
        : (dd<=14 ? '<div class="note"><strong>'+nm+' BAS due in '+dd+' days</strong> — '+esc(q[2])+', due '+fmtDate(q[3])+'.</div>' : '');
    });
  });
  return out;
}
var PROTO_NOTE = '<div class="note acc">This is a prototype for testing the workpaper model and the calculations. '

function phaseBlocks(F){
  var ph = phase(), allLodged = F.every(function(x){ return returnLodged(x.o); });
  var top = "", bottom = "";
  if(ph==="prep" || ph==="past") top += prepCard(F);
  if(ph==="past" || (ph==="prep" && allLodged)) bottom += "";
  var title = ph==="during" ? "Readiness — worth keeping clear as you go"
            : ph==="yearend" ? "Readiness — clear these before 30 June"
            : "Readiness — what still stands between these workpapers and the return";
  var ready = readinessCard(F, title), ye = ph==="yearend" ? yearEndCard(F) : "";
  return {ph:ph, top:top, ready:ready, ye:ye};
}
function phaseSub(ph){
  return ph==="during" ? "Year to date. The BAS is the only thing on a quarterly clock, so it gets one line; everything else builds toward the return."
       : ph==="yearend" ? "The year is nearly over, so this page now leads with what has to be finished before 30 June."
       : ph==="prep" ? "The year has ended. These are the full-year figures for the return."
       : "A closed year, shown for reference.";
}
var TODO = [
  ["missing","deduction row{s} without written evidence","s07"],
  ["needInv","business expense{s} over $82.50 without a tax invoice","s05"],
  ["basOpen","BAS quarter{s} ended but not marked lodged","bas"],
  ["basReopened","BAS quarter{s} reopened, not re-locked","bas"],
  ["superPending","super contribution{s} missing a notice of intent or acknowledgement","d12"],
  ["ccOver","concessional super over the cap","tests"],
  ["overlap","phone & internet row{s} overlapping the WFH fixed rate","s07"],
  ["psiUnset","personal services income status not assessed","setup"],
  ["pool","business asset{s} over the write-off threshold — for your agent","s05"],
  ["unpaid","invoice{s} not yet paid or received","s05"]

function todoCard(F){
  var multi = F.length>1, items = [], clear = 0, total = 0;
  TODO.forEach(function(t){
    F.forEach(function(x){
      var v = x.f[t[0]]; if(v==null) return; total++;
      if(!(v>0)){ clear++; return; }
      var tx = (t[0]==="ccOver"||t[0]==="psiUnset") ? t[1].charAt(0).toUpperCase()+t[1].slice(1) : v+" "+t[1].replace("{s}", v===1?"":"s");
      items.push({who:x.o, text:tx, go:t[2]});
    });
  });
  var u = unconfirmed(); if(u.length && !people().every(function(o){return returnLocked(o);})) items.push({text:plural(u.length,"schedule")+" not confirmed for "+fyLabel(), go:"setup"});
  var car = carriedRates(); if(car.length) items.push({text:plural(car.length,"rate")+" for "+fyLabel()+" not yet published by the ATO — using last year's", go:"rates", soft:true});
  var ph = phase();
  if(ph==="prep" || ph==="past") F.forEach(function(x){ if(!returnLodged(x.o)) items.push({who:x.o, text:fyLabel()+" return not marked lodged", go:"tests"}); });
  return '<div class="todo card card--default"><div class="todohead"><h3>'+(items.length?'To do':'All clear')+'</h3><span class="sharetag">'+clear+' of '+total+' checks clear</span></div>'
    + (items.length ? '<ul>'+items.map(function(i){
        return '<li'+(i.soft?' class="soft"':'')+'><span>'+(multi&&i.who?'<strong>'+esc(i.who)+'</strong> · ':'')+esc(i.text)+'</span><button class="linkbtn" data-go="'+i.go+'">Open</button></li>';
      }).join("")+'</ul>' : '<p class="sub" style="margin:0">Nothing needs attention right now.</p>')
    + '</div>';
}
function overviewHead(){

function renderSummary(){

  var cards = [
    {k:"Taxable income estimate", v:money(tx.taxable), n:money(tx.assessable)+" income less "+money(tx.deductions)+" deductions"},
    {k:"Deductions"+(ytd?" so far":""), v:money(tx.deductions), n:money(f.imm)+" work, "+money(f.wfh)+" home office, "+money(tx.otherDed)+" other"},
  ];
  if(f.hasAbn) cards.push({k:(f.net>=0?"Net business income":"Net business loss")+(ytd?" so far":""), v:money(f.net), n:money(f.sales)+" in, "+money(f.exp)+" out, excl. GST"});
  cards.push({k:"Paid to the ATO", v:money(tx.withheld+tx.payg), n:money(tx.withheld)+" withheld, "+money(tx.payg)+" instalments"});

function renderHousehold(){

    var d = deductionTotals(), w = wfhTotals(), b = businessTotals();
    var byLabel = {};
    d.entries.forEach(function(e){ var k=catLabel(e.r.cat)||"Unlabelled"; byLabel[k]=(byLabel[k]||0)+e.portion; });
    var tx = state.person===HOUSEHOLD ? (function(){ var a=taxFigures(OWNERS[0]), b=taxFigures(OWNERS[1]), o={}; for(var k in a) if(typeof a[k]==="number") o[k]=a[k]+b[k]; return o; })() : taxFigures(state.person);
    return {tx:tx, byLabel:byLabel, imm:d.total, wfh:w.claim, hours:w.hours, rate:w.rate, ded:d.total+w.claim, depr:d.deprTotal,
            sales:b.sales, exp:b.expenses, net:b.sales-b.expenses,
            rows: state.rows.filter(function(r){ return rowFY(r)===fy && mine(r); }).length};
  });
}
function renderHistory(){
  var fys = fysWithData(), Y = {}; fys.forEach(function(f){ Y[f]=yearFigures(f); });
  var labels = {}; fys.forEach(function(f){ for(var k in Y[f].byLabel) labels[k]=1; });
  labels = Object.keys(labels).sort();

  function line(label, get, opts){
    opts = opts||{};
    var prev = null;
    var cells = fys.map(function(f){
      var v = get(Y[f]) || 0, ch = "";
      if(prev!=null && (v!==0 || prev!==0)){
        var diff = v-prev;
        ch = '<br><span class="sharetag">'+(Math.abs(diff)<0.005?'no change':(diff>0?'+':'−')+money(Math.abs(diff)).replace("-","")+(prev?' · '+(diff>0?'+':'−')+Math.abs(Math.round(diff/Math.abs(prev)*100))+'%':''))+'</span>';
      }
      prev = v;
      return '<td class="table__cell r num'+(f===state.fy?' curq':'')+'">'+(v===0&&!opts.total?'<span style="color:var(--muted)">—</span>':money(v))+ch+'</td>';
    }).join("");
    return '<tr class="table__row'+(opts.total?' total':'')+'"><td class="table__cell'+(opts.indent?' ind':'')+'">'+label+'</td>'+cells+'</tr>';
  }
  var head = '<thead class="table__header"><tr class="table__row"><th class="table__column"></th>'+fys.map(function(f){
      return '<th class="table__column r'+(f===state.fy?' curq':'')+'"><button class="linkbtn" data-fy="'+f+'" data-view="summary" title="Open this year">'+fyLabel(f)+'</button></th>'; }).join("")+'</tr></thead>';
  var body = labels.map(function(k){ return line(esc(k), function(y){return y.byLabel[k];}, {indent:true}); }).join("")
    + line("<strong>Immediate deductions</strong>", function(y){return y.imm;}, {total:true})
    + line("Working from home", function(y){return y.wfh;})
    + line("<strong>Total deductions</strong>", function(y){return y.ded;}, {total:true})
    + line("Decline in value — cost of assets acquired", function(y){return y.depr;})

function genTotals(id){
  var g = GEN[id], es = applies(id) ? genEntries(id) : [], t = {n:0, by:{}, rows:es};
  OWNERS.forEach(function(o){ t.by[o]={}; });
  var moneyKeys = g.fields.filter(function(f){return f.t==="money"||f.t==="num";}).map(function(f){return f.k;});
  var calcKeys = (g.cols||[]).map(function(c){return c.k;});
  moneyKeys.concat(calcKeys).forEach(function(k){ t[k]=0; OWNERS.forEach(function(o){ t.by[o][k]=0; }); });
  t.net = 0; t.ok = 0; t.missing = 0;
  var seen = {};
  es.forEach(function(e){
    var r=e.r, c = g.calc ? g.calc(r) : {};
    if(!seen[r.id]){ seen[r.id]=1; t.n++; if(g.doc && !r.doc) t.missing++; }
    var counts = !g.rowOk || g.rowOk(r);
    if(counts) t.ok++;
    moneyKeys.forEach(function(k){ var v=(Number(r[k])||0)*e.share; if(!(g.tax&&g.tax.onlyOk)||counts){ t[k]+=v; t.by[e.o][k]+=v; } });
    calcKeys.forEach(function(k){ var v=(Number(c[k])||0)*e.share; t[k]+=v; t.by[e.o][k]+=v; });
    if(g.net){ var v2=(Number(r[g.net.k])||0)*e.share; t.net += g.net.plus(r) ? v2 : -v2; }
  });

  return t;
}

function genCollect(sec, r, val, chk){
  var g = GEN[sec.id], ok = true;
  g.fields.forEach(function(f){
    var id="g-"+f.k, v;
    if(f.t==="money"||f.t==="num"){ v = parseFloat(val(id)); if(isNaN(v)) v = 0; if(f.req && !val(id)) ok=false; }
    else if(f.t==="check") v = chk(id);
    else { v = val(id); if(f.req && !v) ok=false; }
    r[f.k]=v;
  });
  r.owner = val("e-owner") || OWNERS[0];
  if(r.owner===SHARED){ r.share=parseFloat(val("e-share")); if(isNaN(r.share)) r.share=50; r.share=Math.max(0,Math.min(100,r.share)); }
  if(g.doc) r.doc = chk("e-doc");
  if(g.rate){ var rt=parseFloat(val("e-rate")); if(!isNaN(rt)&&rt!==g.rate.get()){ g.rate.set(rt); savePrefs(); } }
  return ok;
}
// what each person's return looks like from every schedule
function taxFigures(o){
  return asPerson(o, function(){
    var f = {o:o, income:0, withheld:0, offsets:0, rfb:0, resc:0, sg:0, superClaim:0, cgt:0, rentNet:0, otherDed:0, phi:null, superOk:0, superPending:0};
    for(var id in GEN){
      var g=GEN[id], t=genTotals(id);
      if(g.tax.income) g.tax.income.forEach(function(k){ f.income += t[k]||0; });
      if(g.tax.withheld) g.tax.withheld.forEach(function(k){ f.withheld += t[k]||0; });
      if(g.tax.offsets) g.tax.offsets.forEach(function(k){ f.offsets += t[k]||0; });
      if(g.tax.rfb) f.rfb += t.rfb||0;
      if(g.tax.resc) f.resc += t.resc||0;
      if(g.tax.cgt) f.cgt += t[g.tax.cgt]||0;
      if(g.tax.rentNet) f.rentNet += t.net||0;
      if(g.tax.ded) f.otherDed += t[g.tax.ded]||0;
      if(g.tax.sg) f.sg += t.sg||0;
      if(id==="d12") f.superClaim = t.amount||0;
      if(g.tax.phi && t.n) f.phi = {premiums:t.premiums, rebate:t.rebate, days:t.days};
      if(id==="d12"){ f.superOk = t.ok; f.superPending = t.n - t.ok; }
    }
    var d = deductionTotals(), w = wfhTotals(), b = businessTotals();
    f.workDed = d.total + w.claim;
    var bn = abnHolders().length ? b.sales - b.expenses : 0;
    f.business = Math.max(0, bn); f.businessLoss = Math.max(0, -bn);   // a loss is deferred unless a non-commercial loss test is passed
    f.cgtNet = Math.max(0, f.cgt);
    f.rentIn = Math.max(0, f.rentNet);
    f.assessable = f.income + f.business + f.cgtNet + f.rentIn;
    f.deductions = f.workDed + f.otherDed;
    f.taxable = Math.max(0, f.assessable - f.deductions);
    f.investLoss = Math.max(0, -f.rentNet);              // net investment loss (rent only, for now)
    f.testIncome = f.taxable + f.rfb + f.resc + f.investLoss;   // income for surcharge / rebate purposes
    f.concessional = f.sg + f.resc + f.superClaim;
    f.ccCap = rate("ccCap"); f.ccCarry = Number((state.prefs.misc||{})["ccCarry:"+state.fy+":"+o])||0;
    f.ccRoom = f.ccCap + f.ccCarry - f.concessional;
    var payg = 0; QUARTERS.forEach(function(q,i){ payg += Number(paygFor(i,o))||0; });
    f.payg = payg;
    return f;
  });
}

    +'<tr class="table__row"><td class="table__cell"><strong>Business &amp; BAS</strong></td><td class="table__cell">Belong to whoever holds the ABN; never combined or split.</td></tr>'
