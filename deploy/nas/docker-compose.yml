# Workpapers on the Synology (DS1522+, DSM 7.4.1).
# Container Manager → Project → Create → Path: docker/workpapers → Source: "Create docker-compose.yml" → paste this file.
# Before pasting: replace PASTE_AUTH_KEY_HERE with the Tailscale auth key (one line, starts with tskey-auth-).
# App address once running: https://workpapers.tail74ef01.ts.net
name: workpapers
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: workpapers-tailscale
    hostname: workpapers
    environment:
      TS_AUTHKEY: PASTE_AUTH_KEY_HERE   # only used on first start; the NAS stays joined afterwards
      TS_AUTH_ONCE: "true"              # log in only if not already signed in (the saved login lives in ts_state)
      TS_USERSPACE: "true"              # DSM containers have no TUN device; userspace mode is the supported path
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/ts-serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:workpapers
    volumes:
      - /volume1/docker/workpapers/ts_state:/var/lib/tailscale
      - /volume1/docker/workpapers/config:/config:ro
    restart: unless-stopped

  app:
    image: ghcr.io/mynameiseeyern/workpapers:latest
    pull_policy: always                 # every Build downloads the newest version (Container Manager can't check GitHub for updates)
    container_name: workpapers-app
    network_mode: service:tailscale     # reachable only through Tailscale; nothing opened on the home network
    depends_on:
      - tailscale
    user: "0:0"                         # write to the NAS folder without fiddling with DSM permissions
    volumes:
      - /volume1/docker/workpapers/pb_data:/pb/pb_data
    restart: unless-stopped
